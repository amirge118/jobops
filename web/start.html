<!doctype html>
<html lang="he" dir="rtl">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>התחלה — jobOps</title><link rel="stylesheet" href="/styles.css"></head>
  <body data-page="start">
    <div id="app-shell"></div>
    <div class="shell">
      <main class="page-main">
        <section class="page-hero"><div><h1>התחלה</h1><p>כמה צעדים עד שהמערכת מחפשת עבורך. אפשר לדלג ולחזור לכאן מתי שתרצה.</p></div></section>
        <section class="page-section profile-panel"><ol id="start-steps" class="start-steps"></ol></section>
        <section class="page-section profile-panel" aria-labelledby="status-title">
          <h2 id="status-title" class="profile-subtitle">מצב המערכת</h2>
          <ul id="start-status" class="start-status"></ul>
        </section>
        <section class="page-section profile-panel" aria-labelledby="data-title">
          <h2 id="data-title" class="profile-subtitle">הנתונים שלך</h2>
          <p class="profile-hint">קובץ עם קורות החיים, ההעדפות, המועמדויות וההחלטות שלך. הוא כולל פרטים אישיים, אז כדאי לשמור אותו במקום בטוח.</p>
          <a class="button button-secondary" href="/api/profile/export" download>הורדת הנתונים שלי</a>
        </section>
        <p id="page-feedback" class="company-feedback" role="status" aria-live="polite"></p>
      </main>
      <footer><span>המידע נשאר מקומי במחשב שלך.</span></footer>
    </div>
    <script type="module" src="/shared/app-shell.js"></script>
    <script type="module" src="/pages/start-page.js"></script>
  </body>
</html>
