<!doctype html>
<html lang="he" dir="rtl">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>הגדרות חיפוש — jobOps</title><link rel="stylesheet" href="/styles.css"></head>
  <body data-page="settings">
    <div id="app-shell"></div>
    <div class="shell">
      <main class="page-main">
        <section class="page-hero"><div><h1>הגדרות חיפוש</h1><p>מה אתה מחפש ומאיפה להביא משרות.</p></div></section>
        <div id="file-drift" class="profile-notice" role="status" hidden></div>
        <div id="rescore-banner" class="profile-notice" role="status" hidden></div>
        <nav class="profile-tabs" role="tablist" aria-label="חלקי ההגדרות">
          <button type="button" role="tab" data-tab="preferences" aria-selected="true">מה אני מחפש</button>
          <button type="button" role="tab" data-tab="sources" aria-selected="false">מקורות והתראות</button>
        </nav>
        <section id="tab-preferences" class="page-section profile-panel" role="tabpanel">
          <form id="search-form" class="profile-search"></form>
          <h2 class="profile-subtitle">במילים שלך</h2>
          <p class="profile-hint">שכר, סביבת עבודה וכל מה שלא נכנס לשדות למעלה. הטקסט הזה נשלח לניקוד, ולכן שינוי בו משפיע על הציונים.</p>
          <div id="editor-preferences"></div>
        </section>
        <section id="tab-sources" class="page-section profile-panel" role="tabpanel" hidden><div id="sources-root"></div></section>
        <p id="page-feedback" class="company-feedback" role="status" aria-live="polite"></p>
      </main>
      <footer><span>המידע נשאר מקומי במחשב שלך.</span><span id="last-updated"></span></footer>
    </div>
    <script type="module" src="/shared/app-shell.js"></script>
    <script type="module" src="/pages/settings-page.js"></script>
  </body>
</html>
