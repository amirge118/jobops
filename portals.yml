# Portal Scanner Configuration — jobOps (Israel market)
# Used by: node scripts/scan.mjs   (zero-token scanner, hits ATS JSON APIs directly)
#
# NOTE: title_filter.positive is a broad starting set — /setup updates it
# to match your actual target roles after your CV is imported.
# Company board tokens are best-effort; run `node scripts/scan.mjs --dry-run`
# and disable/fix any company that errors.

location_filter:
  always_allow:
    - "Israel"
    - "Tel Aviv"
    - "Tel-Aviv"
    - "Herzliya"
    - "Ramat Gan"
    - "Jerusalem"
    - "Haifa"
  allow:
    - "Israel"
    - "Tel Aviv"
    - "Tel-Aviv"
    - "Herzliya"
    - "Ramat Gan"
    - "Jerusalem"
    - "Haifa"
    - "Remote"
  block:
    - "United States"
    - "New York"
    - "San Francisco"
    - "United Kingdom"
    - "London"
    - "India"
    - "Poland"
    - "Portugal"
    - "Ukraine"

# -- Recency filter (optional) --
# Uncomment to only keep postings within N hours of their posting date (Greenhouse/
# Lever/Ashby only, for now — other providers don't expose a date yet). Off by
# default. For a one-off check without editing this file, use
# `node scripts/scan.mjs --max-age=48` instead — it overrides this setting.
# recency_filter:
#   max_age_hours: 48

# -- Title filter --
# At least 1 positive must match AND 0 negatives (case-insensitive).
# Set via /setup 2026-07-28 — target roles: Backend Engineer, Data Engineer.
title_filter:
  positive:
    - "Software Engineer"
    - "Backend"
    - "Data Engineer"
    - "Python"
  negative:
    - "Intern"
    - "Student"
    - "Embedded"
    - "Firmware"
    - "QA"
    - "Manual"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"

# -- Search queries (WebSearch-based, used by /search skill agents) --
search_queries:
  - name: Greenhouse — Israel
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Tel Aviv" OR "Israel" software engineer'
    enabled: true

  - name: Lever — Israel
    query: 'site:jobs.lever.co "Tel Aviv" OR "Israel" engineer'
    enabled: true

  - name: Comeet — Israel
    query: 'site:comeet.com "Tel Aviv" OR "Israel" engineer'
    enabled: true

  - name: Drushim
    query: 'site:drushim.co.il מהנדס תוכנה OR מפתח'
    enabled: true

  - name: AllJobs
    query: 'site:alljobs.co.il מפתח OR מהנדס תוכנה'
    enabled: true

  - name: JobMaster
    query: 'site:jobmaster.co.il מפתח תוכנה'
    enabled: true

