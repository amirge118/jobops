<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — Cover Letter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 11.5px;
    line-height: 1.65;
    color: #1a1a2e;
    background: #ffffff;
  }
  .page { max-width: 7.3in; margin: 0 auto; }
  .header { margin-bottom: 24px; }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-bottom: 8px;
  }
  .contact-row { font-size: 10.5px; color: #555; }
  .contact-row a { color: #555; text-decoration: none; }
  .meta { margin-bottom: 20px; font-size: 11px; color: #444; }
  .meta .date { color: #777; margin-bottom: 8px; }
  .salutation { margin-bottom: 12px; font-weight: 600; }
  .body p { margin-bottom: 12px; color: #2f2f2f; }
  .signoff { margin-top: 18px; }
  .signoff .name { font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">{{PHONE}} | {{EMAIL}} | <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a> | {{LOCATION}}</div>
  </div>

  <div class="meta">
    <div class="date">{{DATE}}</div>
    <div>{{RECIPIENT_NAME}}<br>{{COMPANY}}</div>
  </div>

  <div class="salutation">Dear {{RECIPIENT_OR_HIRING_MANAGER}},</div>

  <div class="body">
    {{BODY_PARAGRAPHS}}
  </div>

  <div class="signoff">
    Sincerely,
    <div class="name">{{NAME}}</div>
  </div>
</div>
</body>
</html>
